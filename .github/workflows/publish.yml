name: Publish to GitHub Packages

# Called by release.yml after it bumps and tags a version on main.
# Pushing a v* tag by hand, or running this manually on a tag, also publishes (a fallback if a release half-fails).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The tag to publish, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@aaronherbert'
      - run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(inputs.ref || github.ref_name, 'v')
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version ($expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm publish # runs `prepare`, which builds dist/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

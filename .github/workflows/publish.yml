name: Publish to GitHub Packages

# Release: bump the version with `npm version patch|minor|major`, then `git push --follow-tags`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@aaronherbert'
      - run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm publish # runs `prepare`, which builds dist/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
